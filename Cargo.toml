[package]
name = "hardware-probe"
version = "0.1.0"
edition = "2021"
description = "Cross-platform CPU, memory, disk, and accelerator hardware probe"
license = "MIT OR Apache-2.0"

[lib]
name = "hardware_probe"
path = "src/lib.rs"

[[bin]]
name = "hardware-probe"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = "0.13"
